name: Live regression checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-regression
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:live:config
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify public site with isolated synthetic data
        run: npm run test:live
        env:
          DEPLOYED_BASE_URL: https://fabian20ro.github.io/emotid/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: live-regression-report
          path: |
            playwright-report/live/
            test-results/live/
          if-no-files-found: ignore
          retention-days: 14
