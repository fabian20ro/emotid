name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check product policy
        run: npm run check:policy

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify live regression configuration
        run: npm run test:live:config

      - name: Build
        run: npm run build

      - name: Check production performance budgets
        run: npm run check-performance

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify language Fast Refresh
        run: npm run test:language-refresh

      - name: Run production browser tests
        run: npm run test:e2e
        env:
          E2E_PRODUCTION: 'true'

      - name: Verify production PWA lifecycle
        run: npm run test:pwa

      - name: Verify PWA retry isolation
        run: npm run test:pwa:retry

      - name: Retain PWA retry evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pwa-retry-evidence
          path: |
            .reports/pwa-retry.json
            test-results/pwa-retry/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Record production mobile performance
        run: npm run test:performance:run

      - name: Upload performance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-summary
          path: test-results/performance/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  deployed-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed PWA
        run: npm run test:deployed
        env:
          DEPLOYED_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOYED_REVISION: ${{ github.sha }}

      - name: Upload deployed smoke report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployed-smoke-report
          path: |
            playwright-report/deployed/
            test-results/deployed/
          if-no-files-found: ignore
          retention-days: 7
